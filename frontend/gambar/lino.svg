  <!-- telinga -->
  <ellipse cx="28" cy="40" rx="15" ry="19" fill="#8a6440" transform="rotate(-25 28 40)"/>
  <ellipse cx="28" cy="40" rx="8" ry="12" fill="#e9b7a0" transform="rotate(-25 28 40)"/>
  <ellipse cx="92" cy="40" rx="15" ry="19" fill="#8a6440" transform="rotate(25 92 40)"/>
  <ellipse cx="92" cy="40" rx="8" ry="12" fill="#e9b7a0" transform="rotate(25 92 40)"/>
